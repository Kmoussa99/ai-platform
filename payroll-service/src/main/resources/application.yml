server: { port: 8085 }
spring:
  application: { name: payroll-service }
  threads: { virtual: { enabled: true } }
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/payroll_db
    username: ai_admin
    password: ai_admin_pwd
  jpa:
    hibernate: { ddl-auto: update }
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://keycloak:8080/realms/ai-platform}
          jwk-set-uri: ${KEYCLOAK_JWKS:http://keycloak:8080/realms/ai-platform/protocol/openid-connect/certs}

payroll:
  ci:
    taux-cnps-salarial: 0.032
    taux-cnps-patronal: 0.149
    plafond-cnps: 1647315
    smic: 60000
    cmu-fixe: 1000
    fpc-taux: 0.012
    taxe-apprentissage: 0.004

management:
  endpoints: { web: { exposure: { include: health,info,prometheus } } }

