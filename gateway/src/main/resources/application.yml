server:
  port: 8000

spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      password: ${REDIS_PASSWORD:redis_pwd}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://keycloak:8080/realms/ai-platform}
          jwk-set-uri: ${KEYCLOAK_JWKS:http://keycloak:8080/realms/ai-platform/protocol/openid-connect/certs}

  cloud:
    gateway:
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 100
            redis-rate-limiter.burstCapacity: 200
            key-resolver: "#{@userKeyResolver}"
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns:
              - "http://localhost:*"
              - "https://*.ai-platform.local"
            allowed-methods: [GET, POST, PUT, DELETE, OPTIONS, PATCH]
            allowed-headers: "*"
            allow-credentials: true
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**
          filters:
            - name: CircuitBreaker
              args: { name: authCB, fallbackUri: forward:/fallback }
        - id: chat-service
          uri: http://chat-service:8082
          predicates:
            - Path=/api/v1/conversations/**,/api/v1/messages/**,/api/v1/chat/**,/api/v1/training/**
          filters:
            - name: CircuitBreaker
              args: { name: chatCB, fallbackUri: forward:/fallback }
        - id: token-service
          uri: http://token-service:8083
          predicates:
            - Path=/api/v1/tokens/**
        - id: document-service
          uri: http://document-service:8084
          predicates:
            - Path=/api/v1/documents/**
        - id: payroll-service
          uri: http://payroll-service:8085
          predicates:
            - Path=/api/v1/payroll/**,/api/v1/employees/**
        - id: ml-service
          uri: http://ml-service:8086
          predicates:
            - Path=/api/v1/ml/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,gateway
  metrics:
    tags:
      application: ${spring.application.name}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  timelimiter:
    configs:
      default:
        timeoutDuration: 120s
        cancelRunningFuture: false
    instances:
      chatCB:
        timeoutDuration: 300s
        cancelRunningFuture: false
      authCB:
        timeoutDuration: 30s

logging:
  level:
    org.springframework.cloud.gateway: INFO
    ci.aiplatform: DEBUG

