server: { port: 8084 }
spring:
  application: { name: document-service }
  threads: { virtual: { enabled: true } }
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/document_db
    username: ai_admin
    password: ai_admin_pwd
  jpa:
    hibernate: { ddl-auto: update }
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:kafka:9092}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://keycloak:8080/realms/ai-platform}
          jwk-set-uri: ${KEYCLOAK_JWKS:http://keycloak:8080/realms/ai-platform/protocol/openid-connect/certs}

minio:
  endpoint: ${MINIO_URL:http://minio:9000}
  access-key: ${MINIO_USER:minio_admin}
  secret-key: ${MINIO_PASSWORD:minio_admin_pwd}
  bucket: ai-documents

ai:
  ollama:
    base-url: ${OLLAMA_URL:http://ollama:11434}
    embedding-model: ${OLLAMA_EMBED:nomic-embed-text}
  qdrant:
    host: ${QDRANT_HOST:qdrant}
    port: 6334
  chunk: { size: 512, overlap: 50 }

management:
  endpoints: { web: { exposure: { include: health,info,prometheus } } }

