server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Proxy API → gateway (Spring Cloud Gateway)
  location /api/ {
    proxy_pass         http://gateway:8000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Streaming SSE (chat) : pas de buffering, longue durée
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    chunked_transfer_encoding on;
  }

  # SPA fallback (Angular routing)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache des assets immutables Angular (hash dans le nom)
  location ~* \.(?:js|css|woff2?|ico|png|jpg|jpeg|svg|gif)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
