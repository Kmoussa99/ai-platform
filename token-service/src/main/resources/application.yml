server: { port: 8083 }
spring:
  application: { name: token-service }
  threads: { virtual: { enabled: true } }
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/token_db
    username: ai_admin
    password: ai_admin_pwd
  jpa:
    hibernate: { ddl-auto: update }
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      password: ${REDIS_PASSWORD:redis_pwd}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://keycloak:8080/realms/ai-platform}
          jwk-set-uri: ${KEYCLOAK_JWKS:http://keycloak:8080/realms/ai-platform/protocol/openid-connect/certs}
management:
  endpoints: { web: { exposure: { include: health,info,prometheus } } }

