apiVersion: v1
kind: Namespace
metadata:
  name: ai-platform
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway, namespace: ai-platform }
spec:
  replicas: 2
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      containers:
      - name: gateway
        image: ghcr.io/ci/ai-platform-gateway:1.0.0
        ports: [{ containerPort: 8000 }]
        env:
        - { name: SPRING_PROFILES_ACTIVE, value: prod }
        - { name: KEYCLOAK_ISSUER, value: "http://keycloak:8080/realms/ai-platform" }
        readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8000 }, initialDelaySeconds: 20 }
        livenessProbe:  { httpGet: { path: /actuator/health/liveness,  port: 8000 }, initialDelaySeconds: 60 }
        resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { cpu: 1, memory: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: gateway, namespace: ai-platform }
spec:
  selector: { app: gateway }
  ports: [{ port: 80, targetPort: 8000 }]
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: gateway-hpa, namespace: ai-platform }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: gateway }
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }

